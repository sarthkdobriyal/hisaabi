<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" role="img" aria-label="A phone with your expense tracker on it, sealed like a safe when locked.">
  <style>
    .title { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; font-size: 21px; font-weight: 700; fill: #0f172a; }
    .caption { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; font-size: 14px; fill: #475569; }
    .caption-bold { font-weight: 700; fill: #0f172a; }
    .badge { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; font-size: 11.5px; font-weight: 700; }
    .safe-body { fill: #0d9488; }
    .safe-door { fill: #0f766e; }
    @media (prefers-color-scheme: dark) {
      .title { fill: #f1f5f9; }
      .caption { fill: #cbd5e1; }
      .caption-bold { fill: #f1f5f9; }
    }
  </style>

  <text x="400" y="44" text-anchor="middle" class="title">A locked expense tracker is a sealed safe</text>

  <!-- Phone -->
  <g>
    <rect x="150" y="66" width="240" height="336" rx="36" fill="#0f172a"/>
    <rect x="162" y="78" width="216" height="312" rx="28" fill="#f8fafc"/>
    <!-- safe -->
    <rect x="202" y="150" width="136" height="168" rx="14" class="safe-body"/>
    <rect x="214" y="162" width="112" height="144" rx="10" class="safe-door"/>
    <circle cx="270" cy="234" r="26" fill="none" stroke="#ffffff" stroke-width="4"/>
    <path transform="translate(254 218)" fill="#ffffff" d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/>
    <circle cx="258" cy="256" r="3" fill="#ffffff" opacity="0.8"/>
    <circle cx="270" cy="256" r="3" fill="#ffffff" opacity="0.5"/>
    <circle cx="282" cy="256" r="3" fill="#ffffff" opacity="0.3"/>
    <!-- dots below safe -->
    <circle cx="250" cy="344" r="4" fill="#0d9488"/>
    <circle cx="270" cy="344" r="4" fill="#0d9488"/>
    <circle cx="290" cy="344" r="4" fill="#0d9488"/>
    <text x="270" y="368" text-anchor="middle" class="badge" fill="#0f172a">Hisaabi</text>
  </g>

  <!-- Captions -->
  <g>
    <text x="440" y="130" class="caption"><tspan class="caption-bold" fill="#0f172a">Locked</tspan> — a sealed safe.<br/></text>
  </g>
  <text class="caption">
    <tspan x="440" y="130"><tspan class="caption-bold">Locked</tspan> — a sealed safe. Someone</tspan>
    <tspan x="440" dy="22">picking up the phone sees only a</tspan>
    <tspan x="440" dy="22">passcode screen and unreadable</tspan>
    <tspan x="440" dy="22">ciphertext. That&apos;s encryption at rest.</tspan>
    <tspan x="440" dy="34"><tspan class="caption-bold">Unlocked</tspan> — the safe is open and the</tspan>
    <tspan x="440" dy="22">app is working. The data is out on</tspan>
    <tspan x="440" dy="22">the table because you&apos;re using it.</tspan>
    <tspan x="440" dy="22">Auto-lock closes the safe again.</tspan>
  </text>

  <rect x="440" y="330" width="300" height="36" rx="18" fill="rgba(13,148,136,0.12)"/>
  <text x="590" y="353" text-anchor="middle" class="badge" fill="#0d9488">AES-256-GCM · PBKDF2 ×600,000 · auto-lock</text>
</svg>
